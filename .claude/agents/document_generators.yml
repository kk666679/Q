agent:
  name: document-generators
  version: 1.0.0
  description: Generates structured documents from input data

inputs:
  - name: title
    type: string
    required: true
  - name: content
    type: string
    required: true
  - name: format
    type: string
    default: markdown
    allowed: [markdown, pdf, html]

outputs:
  - name: document
    type: file
    format: "*{{ input.format }}*"

steps:
  - name: validate input
    action: validate
    rules:
      - field: title
        condition: not_empty
      - field: content
        condition: min_length: 10

  - name: generate document
    action: transform
    engine: template
    template:
      # "{{ input.title }}"

  - name: export
    action: save_file
    path: "./output/{{ input.title | slug }}.{{ input.format }}"
    
settings:
  logging: true
  retry_on_failure: 2